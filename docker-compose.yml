services:
  league-coach:
    build: .
    image: league-coach:latest
    container_name: league-coach
    restart: unless-stopped
    env_file: .env
    volumes:
      - league-coach-data:/data
    ports:
      # Nginx Proxy Manager redirige coach.wytherrbastion.fr vers <IP du serveur>:8085
      - "8085:8000"

volumes:
  league-coach-data:
