services:
  league-coach:
    build: .
    image: league-coach:latest
    container_name: league-coach
    restart: unless-stopped
    env_file: .env
    volumes:
      - league-coach-data:/data
    ports:
      # Adresse et port exposés sur l'hôte (BIND_IP et PORT dans .env), à cibler depuis le reverse proxy
      - "${BIND_IP:-0.0.0.0}:${PORT:-8085}:8000"

volumes:
  league-coach-data:
