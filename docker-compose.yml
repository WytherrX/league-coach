services:
  league-coach:
    build: .
    image: league-coach:latest
    container_name: league-coach
    restart: unless-stopped
    env_file: .env
    volumes:
      - league-coach-data:/data
    ports:
      # Port exposé sur l'hôte (PORT dans .env, 8085 par défaut), à cibler depuis le reverse proxy
      - "${PORT:-8085}:8000"

volumes:
  league-coach-data:
